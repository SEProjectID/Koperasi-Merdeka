name: Build APK Koperasi Merdeka

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Alamat web koperasi (kosongkan untuk pakai default di app.config.json)"
        required: false
        default: ""
      app_name:
        description: "Nama aplikasi"
        required: false
        default: "Koperasi Merdeka"
      version_code:
        description: "Nomor versi (angka, naikkan tiap rilis baru)"
        required: false
        default: "1"
      version_name:
        description: "Nama versi (contoh 1.0.0)"
        required: false
        default: "1.0.0"
      release:
        description: "Build APK rilis bertanda tangan (butuh Secrets keystore)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Terima lisensi Android SDK (SDK sudah bawaan runner)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK siap."

      - uses: gradle/actions/setup-gradle@v4

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan proyek Android (alamat, ikon, splash)
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
        run: npm run setup

      - name: Keystore (hanya untuk rilis)
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 belum diisi"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KoperasiMerdeka-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
